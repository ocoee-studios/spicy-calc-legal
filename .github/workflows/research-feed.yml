name: Update Research Feed

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch PubMed and ClinicalTrials.gov metadata
        run: node .github/scripts/fetch-research-feed.mjs

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/research.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update research feed"
          git push
